<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ số Mặt trận Đồng Nai</title>
    <meta name="description" content="Bản đồ số của Ủy ban MTTQ Việt Nam thành phố Đồng Nai: trụ sở Mặt trận, công trình, mô hình, an sinh xã hội, hoạt động – sự kiện, văn hóa truyền thống; gửi phản ánh, kiến nghị qua mã QR.">
    <meta property="og:title" content="Bản đồ số Mặt trận Đồng Nai">
    <meta property="og:description" content="Tra cứu trụ sở Mặt trận, công trình, mô hình, an sinh xã hội và gửi phản ánh, kiến nghị.">
    <meta property="og:type" content="website">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f4f6f9; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- allow: cho phép nút "Lấy GPS", "Vị trí của tôi" và sao chép link hoạt động trong khung nhúng -->
    <iframe id="app" allow="geolocation; clipboard-write; fullscreen" title="Bản đồ số Mặt trận Đồng Nai"></iframe>
    <script>
        // Chuyển tiếp tham số (?ma=, ?donvi=, ?diem=) vào ứng dụng để link chia sẻ / mã QR mở đúng nơi
        (function () {
            var base = "https://script.google.com/macros/s/AKfycbx8JDOZ5txmDU7eY2jIOawyqHSqQCtwznA7FtaGtzg7thcejHVgb1Yn-XeMRVvx4slCTQ/exec";
            var q = location.search;
            document.getElementById("app").src = base + (/^\?[\w=&.%\-]{1,200}$/.test(q) ? q : "");
        })();
    </script>
</body>
</html>
